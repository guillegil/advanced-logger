[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advancedlogger"
version = "1.0.0"
description = "A custom logger with advanced capabilities to easy up development of other modules and testing."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }

authors = [{ name = "Guillermo Gil", email = "guillegil@proton.me" }]

keywords = ["pytest", "logger", "qa", "logging", "reporting", "test-procedure"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = ["colored>=1.4.4"]

[project.urls]
Homepage = "https://github.com/guillegil/advanced_logger"
BugTracker = "https://github.com/guillegil/advanced_logger/issues"

[tool.setuptools.packages.find]
where = ["src"] # tells setuptools to look for packages inside src/
